name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # report every version, rather than cancel the rest after one failure
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]  # keep in line with the classifiers in pyproject.toml
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Dependencies
        run: uv sync --group dev
      - name: Run Pytest
        run: uv run pytest

  lint-and-types:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"  # the lowest supported version
          enable-cache: true
      - name: Install Dependencies
        run: uv sync --group dev --extra client  # mypy also checks the client, which imports the OpenAI SDK
      - name: Run Ruff
        run: uv run ruff check
      - name: Run Mypy
        run: uv run mypy

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build Docker image
        run: docker build -t swiss-weather-mcp-ci-image .
